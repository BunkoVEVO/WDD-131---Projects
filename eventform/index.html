<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student event registration form">
  <title>Event Registration</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">WDD 131 · Event Registration</p>
      <h1>Sign Up for the Event</h1>
      <p>Complete the form below to reserve your place.</p>
    </header>

    <form id="eventForm" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
        </div>

        <div class="field">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
        </div>

        <div class="field full">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="eventDate">Date of Event</label>
          <input type="date" id="eventDate" name="eventDate" required>
        </div>

        <div class="field">
          <label for="ticketType">Type</label>
          <select id="ticketType" name="ticketType" required>
            <option value="">Choose one...</option>
            <option value="student">Student</option>
            <option value="guest">Guest</option>
          </select>
        </div>

        <div class="field full" id="typeInfo" hidden>
          <label for="typeCode" id="typeCodeLabel">Student I#</label>
          <input type="text" id="typeCode" name="typeCode" autocomplete="off">
          <small id="typeCodeHint">Enter your 9-digit student I number.</small>
        </div>
      </div>

      <button type="submit">Register for Event</button>
    </form>

    <section id="feedback" class="feedback" aria-live="polite" aria-atomic="true"></section>
  </main>
</body>
</html>
